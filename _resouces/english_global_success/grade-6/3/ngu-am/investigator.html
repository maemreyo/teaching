<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game: Thám Tử Tí Hon (Nâng cao)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7fafc;
        }
        .character-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .character-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .correct {
            border: 4px solid #48bb78;
            box-shadow: 0 0 20px #48bb78;
        }
        .incorrect {
            border: 4px solid #f56565;
            box-shadow: 0 0 20px #f56565;
        }
        .modal {
            display: none; /* Hidden by default */
        }
        .modal.flex {
            display: flex;
        }
        #timer-bar {
            height: 6px;
            background-color: #4299e1;
            width: 100%;
            transform-origin: left;
            transition: transform 15s linear;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="game-container" class="w-full max-w-3xl bg-white p-6 rounded-2xl shadow-xl relative overflow-hidden">
        <div id="timer-bar-container" class="absolute top-0 left-0 w-full h-[6px] bg-gray-200">
            <div id="timer-bar"></div>
        </div>
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-3xl font-bold text-gray-800">Thám Tử Tí Hon 🕵️</h1>
            <div id="lives" class="text-3xl">❤️❤️❤️</div>
        </div>
        <p class="text-center text-gray-500 mb-6">Sử dụng 2 manh mối để tìm đúng người bạn nhé!</p>

        <!-- Clues Area -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="w-full bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded-lg">
                <p class="font-bold">Manh mối 1 (Tính cách):</p>
                <p id="personality-clue" class="text-lg h-12">Hãy tìm người bạn...</p>
            </div>
            <div class="w-full bg-purple-100 border-l-4 border-purple-500 text-purple-700 p-4 rounded-lg">
                <p class="font-bold">Manh mối 2 (Ngữ âm):</p>
                <p id="sound-clue" class="text-lg">Họ cầm một vật có âm...</p>
            </div>
        </div>

        <!-- Characters Grid -->
        <div id="character-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 min-h-[200px]">
            <!-- Character cards will be injected by JS -->
        </div>

        <!-- Feedback and Score -->
        <div class="flex justify-between items-center">
            <div id="feedback-message" class="text-lg font-semibold h-10">&nbsp;</div>
            <div class="text-xl font-bold">Điểm: <span id="score">0</span></div>
        </div>
    </div>
    
    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal fixed inset-0 bg-black bg-opacity-70 items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-lg text-center">
            <h2 class="text-4xl font-bold text-red-500 mb-4">Thua rồi!</h2>
            <p class="text-lg mb-2">Điểm cuối cùng của bạn là: <strong id="final-score" class="text-2xl">0</strong></p>
            <p class="text-lg mb-6">Hãy cố gắng hơn ở lần sau nhé!</p>
            <button id="play-again-button" class="bg-blue-500 text-white font-bold py-3 px-8 rounded-full text-xl hover:bg-blue-600">Chơi lại</button>
        </div>
    </div>

    <script>
        const personalityClueEl = document.getElementById('personality-clue');
        const soundClueEl = document.getElementById('sound-clue');
        const characterGridEl = document.getElementById('character-grid');
        const feedbackMessageEl = document.getElementById('feedback-message');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const timerBarEl = document.getElementById('timer-bar');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreEl = document.getElementById('final-score');
        const playAgainButton = document.getElementById('play-again-button');

        const personalities = [
            { id: 'active', name: 'năng động', english: 'active', definition: 'luôn bận rộn làm việc, đặc biệt là các hoạt động thể chất', visual: '🏃' },
            { id: 'boring', name: 'buồn tẻ', english: 'boring', definition: 'không thú vị hoặc hào hứng', visual: '😑' },
            { id: 'confident', name: 'tự tin', english: 'confident', definition: 'tin tưởng vào khả năng của bản thân', visual: '😎' },
            { id: 'curious', name: 'tò mò', english: 'curious', definition: 'muốn tìm hiểu về mọi thứ xung quanh', visual: '🤔' },
            { id: 'funny', name: 'vui tính', english: 'funny', definition: 'khiến người khác bật cười', visual: '😂' },
            { id: 'generous', name: 'hào phóng', english: 'generous', definition: 'sẵn sàng cho đi tiền bạc hoặc thời gian', visual: '🎁' },
            { id: 'patient', name: 'kiên nhẫn', english: 'patient', definition: 'có thể chờ đợi một cách bình tĩnh', visual: '🧘' },
            { id: 'shy', name: 'bẽn lẽn', english: 'shy', definition: 'cảm thấy lo lắng khi nói chuyện với người lạ', visual: '😳' },
            { id: 'sporty', name: 'thể thao', english: 'sporty', definition: 'thích và giỏi các môn thể thao', visual: '⚽' },
            { id: 'serious', name: 'nghiêm túc', english: 'serious', definition: 'luôn suy nghĩ cẩn thận và không hay đùa', visual: '😐' }
        ];

        const objects = {
            p: [ { id: 'pen', name: 'cái bút', english: 'pen', visual: '🖊️' }, { id: 'pizza', name: 'bánh pizza', english: 'pizza', visual: '🍕' }, { id: 'purse', name: 'cái ví', english: 'purse', visual: '👛' }, { id: 'party-popper', name: 'pháo giấy', english: 'party popper', visual: '🎉' } ],
            b: [ { id: 'book', name: 'quyển sách', english: 'book', visual: '📖' }, { id: 'ball', name: 'quả bóng', english: 'ball', visual: '🏀' }, { id: 'barbecue', name: 'thịt nướng', english: 'barbecue', visual: '🍖' }, { id: 'boring-book', name: 'quyển sách chán ngắt', english: 'book', visual: '📓' } ]
        };

        let score = 0;
        let lives = 3;
        let currentRoundData = {};
        let timerTimeout;

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function shuffleArray(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function startTimer() {
            timerBarEl.style.transition = 'none';
            timerBarEl.style.transform = 'scaleX(1)';
            setTimeout(() => {
                timerBarEl.style.transition = 'transform 15s linear';
                timerBarEl.style.transform = 'scaleX(0)';
            }, 50); // Small delay to ensure transition restarts
            
            clearTimeout(timerTimeout);
            timerTimeout = setTimeout(() => {
                handleTimeout();
            }, 15000);
        }

        function handleTimeout() {
            loseLife();
            feedbackMessageEl.textContent = "Hết giờ rồi!";
            feedbackMessageEl.className = "text-lg font-semibold text-orange-500";
            document.querySelectorAll('.character-card').forEach(c => c.removeEventListener('click', handleCharacterClick));
            document.querySelector('.character-card[data-is-correct="true"]').classList.add('correct');
            
            setTimeout(() => {
                if (lives > 0) {
                    generateRound();
                }
            }, 2000);
        }

        function loseLife() {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) {
                gameOver();
            }
        }

        function updateLivesDisplay() {
            livesEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
        }

        function gameOver() {
            clearTimeout(timerTimeout);
            finalScoreEl.textContent = score;
            gameOverModal.classList.add('flex');
        }

        function resetGame() {
            score = 0;
            lives = 3;
            scoreEl.textContent = score;
            updateLivesDisplay();
            gameOverModal.classList.remove('flex');
        }

        function generateRound() {
            feedbackMessageEl.innerHTML = '&nbsp;';
            const targetPersonality = getRandomItem(personalities);
            const targetSound = Math.random() < 0.5 ? 'p' : 'b';
            const targetObject = getRandomItem(objects[targetSound]);

            currentRoundData = {
                personality: targetPersonality,
                sound: targetSound,
                object: targetObject
            };
            
            personalityClueEl.textContent = `Tìm người bạn ${targetPersonality.definition}`;
            soundClueEl.textContent = `Họ cầm một vật có âm /${targetSound}/`;

            let characters = [];
            characters.push({ ...targetPersonality, object: targetObject, sound: targetSound, isCorrect: true });

            let remainingPersonalities = personalities.filter(p => p.id !== targetPersonality.id);
            shuffleArray(remainingPersonalities);
            
            const wrongSound = targetSound === 'p' ? 'b' : 'p';
            characters.push({ ...targetPersonality, object: getRandomItem(objects[wrongSound]), sound: wrongSound });
            characters.push({ ...remainingPersonalities[0], object: getRandomItem(objects[targetSound]), sound: targetSound });
            characters.push({ ...remainingPersonalities[1], object: getRandomItem(objects[wrongSound]), sound: wrongSound });

            characterGridEl.innerHTML = '';
            shuffleArray(characters).forEach(char => {
                const card = document.createElement('div');
                card.className = 'character-card bg-gray-100 p-4 rounded-lg flex flex-col items-center justify-center aspect-square';
                card.dataset.personalityId = char.id;
                card.dataset.sound = char.sound;
                card.dataset.isCorrect = char.isCorrect || false;

                card.innerHTML = `<div class="text-6xl">${char.visual}</div><div class="text-4xl mt-2">${char.object.visual}</div>`;
                card.addEventListener('click', handleCharacterClick);
                characterGridEl.appendChild(card);
            });

            startTimer();
        }
        
        function handleCharacterClick(event) {
            clearTimeout(timerTimeout);
            const card = event.currentTarget;
            const { personalityId, sound, isCorrect } = card.dataset;
            document.querySelectorAll('.character-card').forEach(c => c.removeEventListener('click', handleCharacterClick));

            if (isCorrect === 'true') {
                score++;
                feedbackMessageEl.innerHTML = `Chính xác! Bạn <strong class="text-green-500">${currentRoundData.personality.english} (${currentRoundData.personality.name})</strong> cầm <strong class="text-green-500">${currentRoundData.object.english} (${currentRoundData.object.name})</strong>.`;
                card.classList.add('correct');
            } else {
                loseLife();
                card.classList.add('incorrect');
                document.querySelector('.character-card[data-is-correct="true"]').classList.add('correct');

                if (personalityId !== currentRoundData.personality.id) {
                    const wrongPersonality = personalities.find(p => p.id === personalityId);
                    feedbackMessageEl.innerHTML = `Sai rồi! Đây là bạn <strong class="text-red-500">${wrongPersonality.english} (${wrongPersonality.name})</strong>, không phải bạn <strong class="text-blue-500">${currentRoundData.personality.english} (${currentRoundData.personality.name})</strong>.`;
                } else {
                    feedbackMessageEl.innerHTML = `Gần đúng! Bạn <strong class="text-blue-500">${currentRoundData.personality.english} (${currentRoundData.personality.name})</strong>, nhưng vật này có âm /${sound}/.`;
                }
            }
            
            scoreEl.textContent = score;

            if (lives > 0) {
                 setTimeout(generateRound, 2500);
            }
        }

        playAgainButton.addEventListener('click', () => {
            resetGame();
            generateRound();
        });

        // Initial game start
        resetGame();
        generateRound();
    </script>
</body>
</html>
