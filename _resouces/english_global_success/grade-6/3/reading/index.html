<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Skills Game - My Friends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-action {
            transition: all 0.3s ease;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        /* Animation for feedback */
        @keyframes correct-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .correct-animation {
            animation: correct-pulse 0.5s ease-in-out;
        }
        @keyframes incorrect-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .incorrect-animation {
            animation: incorrect-shake 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 text-white flex items-center justify-center min-h-screen p-4">

    <div id="game-container" class="w-full max-w-3xl mx-auto">
        
        <!-- Start Screen -->
        <div id="start-screen" class="card rounded-2xl p-8 text-center shadow-2xl">
            <h1 class="text-4xl font-bold mb-2 text-indigo-400">Reading Skills Game</h1>
            <p class="text-xl mb-6 text-slate-300">Theme: My Friends</p>
            <p class="mb-8 text-slate-400">Read the following passage carefully and answer the questions to test your reading comprehension. Are you ready?</p>
            <button id="start-btn" class="btn-action bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-lg text-lg">
                Start
            </button>
        </div>

        <!-- Reading Screen -->
        <div id="reading-screen" class="hidden card rounded-2xl p-8 shadow-2xl">
            <h2 class="text-3xl font-bold mb-4 text-indigo-400">Read the Passage</h2>
            <div id="passage-container" class="text-left text-slate-300 bg-slate-800/50 p-6 rounded-lg max-h-80 overflow-y-auto">
                <!-- Passage will be inserted here by JS -->
            </div>
            <button id="finished-reading-btn" class="mt-8 btn-action bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-lg text-lg w-full">
                I've Finished Reading!
            </button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden card rounded-2xl p-8 shadow-2xl">
            <div id="game-passage-display" class="text-left text-sm text-slate-400 bg-slate-800/50 p-4 rounded-lg max-h-32 overflow-y-auto mb-4">
                 <!-- Current passage for reference will be inserted here -->
            </div>
            <div class="flex justify-between items-center mb-6">
                <div id="question-counter" class="text-lg font-semibold text-slate-400">Question 1 / 6</div>
                <div id="score-display" class="text-lg font-bold text-green-400">Score: 0</div>
            </div>
            <div class="bg-slate-800/50 rounded-lg p-6 min-h-[120px] flex items-center justify-center mb-6">
                <canvas id="game-canvas" class="w-full h-full"></canvas>
            </div>
            <div id="answer-buttons" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button data-answer="true" class="answer-btn btn-action bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-lg text-xl">
                    True
                </button>
                <button data-answer="false" class="answer-btn btn-action bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-6 rounded-lg text-xl">
                    False
                </button>
            </div>
        </div>

        <!-- End Screen -->
        <div id="end-screen" class="hidden card rounded-2xl p-8 text-center shadow-2xl">
            <h2 class="text-4xl font-bold mb-4 text-indigo-400">Completed!</h2>
            <p class="text-2xl mb-2 text-slate-300">Your final score:</p>
            <p id="final-score" class="text-6xl font-bold my-6 text-green-400">0 / 6</p>
            <p id="feedback-message" class="text-lg mb-8 text-slate-400">Well done!</p>
            <div class="flex justify-center gap-4">
                <button id="restart-quiz-btn" class="btn-action bg-gray-600 hover:bg-gray-500 text-white font-bold py-3 px-8 rounded-lg text-lg">
                    Play Again
                </button>
                <button id="next-passage-btn" class="btn-action bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-8 rounded-lg text-lg">
                    Next Passage
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const readingScreen = document.getElementById('reading-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const passageContainer = document.getElementById('passage-container');
        const gamePassageDisplay = document.getElementById('game-passage-display');

        const startBtn = document.getElementById('start-btn');
        const finishedReadingBtn = document.getElementById('finished-reading-btn');
        const restartQuizBtn = document.getElementById('restart-quiz-btn');
        const nextPassageBtn = document.getElementById('next-passage-btn');
        const answerButtons = document.querySelectorAll('.answer-btn');

        const questionCounter = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');
        const finalScore = document.getElementById('final-score');
        const feedbackMessage = document.getElementById('feedback-message');
        
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // Game Data: Passages and Questions
        const gameData = [
            {
                passageHTML: `
                    <p>Hi, I'm Julie and my best friend is Hanna, we are always together. We are both thirteen years old and we are in the same class. When we have a break in school, we sometimes play skipping and sometimes we just sit and chat. Hanna lives on the same street as me, so we always walk home together and talk about our homework. When I am doing my homework and I don't understand a question, I often call Hanna for help and we do it together. After we finish our homework, we always chat on the computer before we go to bed.</p>
                    <br>
                    <p>At the weekends, we usually go to the mall, Hanna always wants to go shopping but I often like to do other things, like skating or going to the cinema. She often sleeps at my house on Saturdays. We watch a film together and we usually eat popcorn or sometimes we have a pizza. I don't have any brothers or sisters so Hanna is like my sister.</p>
                `,
                questions: [
                    { statement: "Hanna and Julie are cousins.", answer: false },
                    { statement: "They walk home from school.", answer: true },
                    { statement: "They always talk on the phone before going to bed.", answer: false },
                    { statement: "Hanna likes to go shopping but Julie doesn't.", answer: true },
                    { statement: "Julie often sleeps at Hanna's house on Saturdays.", answer: false },
                    { statement: "Julie is an only child.", answer: true }
                ]
            },
            {
                passageHTML: `
                    <p>My best friend Marion is twelve. She's from England but her father is Portuguese. They live in Liverpool, in the North-West of England. The weather there is foggy and wet most of the time.</p>
                    <br>
                    <p>Marion starts school at 9:00 am every day and finishes it at 4 o'clock. After school she plays volleyball and tennis. Marion loves sports. She spends her holidays in Portugal at her grandparents' house, which is opposite my house, and she loves swimming. So we always go swimming when the weather is hot and sunny. At home she doesn't mind making her bed in the morning, nor cooking the meals, but she doesn't like washing the dishes and neither do I. I love my best friend!</p>
                `,
                questions: [
                    { statement: "Marion's father is from Portugal.", answer: true },
                    { statement: "The weather in Marion's hometown is mostly hot and dry.", answer: false },
                    { statement: "Marion goes swimming when she is on holiday in Portugal.", answer: true },
                    { statement: "The author and Marion are classmates.", answer: false },
                    { statement: "At home, Marion doesn't like to cook.", answer: false }
                ]
            },
            {
                passageHTML: `
                    <p>My friends and I are planning a surprise party for our friend, Linh. Her birthday is next Saturday. Tuan is in charge of buying the cake. He is a very reliable person, so we know he will get a great one. Mai is very creative, so she is making the decorations. I am responsible for the music and games.</p>
                    <br>
                    <p>We are all meeting at my house on Saturday afternoon to prepare everything before Linh arrives at 6 PM. We are all very excited and hope she will be happy.</p>
                `,
                questions: [
                    { statement: "Linh's birthday party is on Sunday.", answer: false },
                    { statement: "Mai is responsible for buying the cake.", answer: false },
                    { statement: "Mai is a very creative person.", answer: true },
                    { statement: "They will prepare the party at Linh's house.", answer: false },
                    { statement: "Linh will arrive at the party at 6 PM.", answer: true }
                ]
            }
        ];

        // Game State
        let currentQuestionIndex = 0;
        let score = 0;
        let answerCooldown = false;
        let currentQuestions = [];
        let currentPassageHTML = '';
        let currentGameIndex = -1;

        // Canvas setup
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            if(gameScreen.style.display !== 'none' && currentQuestionIndex < currentQuestions.length) {
                drawQuestion();
            }
        }
        
        window.addEventListener('resize', resizeCanvas);

        // Function to wrap text on canvas
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            const lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);
            
            const totalHeight = lines.length * lineHeight;
            let startY = y - totalHeight / 2 + lineHeight / 2;

            lines.forEach((line, index) => {
                 context.fillText(line.trim(), x, startY + index * lineHeight);
            });
        }

        // Game Flow
        function showScreen(screen) {
            startScreen.classList.add('hidden');
            readingScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            screen.classList.remove('hidden');
        }

        function startGame() {
            // --- BUG FIX: Reset answer cooldown ---
            answerCooldown = false;
            
            // Randomly select a new passage, avoiding the current one if possible
            let newIndex = currentGameIndex;
            if (gameData.length > 1) {
                while (newIndex === currentGameIndex) {
                    newIndex = Math.floor(Math.random() * gameData.length);
                }
            } else {
                newIndex = 0;
            }
            currentGameIndex = newIndex;
            
            const selectedGame = gameData[currentGameIndex];
            currentQuestions = selectedGame.questions;
            currentPassageHTML = selectedGame.passageHTML;

            // Display the passage
            passageContainer.innerHTML = currentPassageHTML;
            gamePassageDisplay.innerHTML = currentPassageHTML;
            
            showScreen(readingScreen);
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            answerCooldown = false;
            showScreen(gameScreen);
            updateHUD();
            // Timeout to ensure canvas is visible before drawing
            setTimeout(() => {
                resizeCanvas();
            }, 10);
        }
        
        function restartQuiz() {
            // This function restarts the quiz for the SAME passage
            startQuiz();
        }

        function drawQuestion() {
            if (currentQuestionIndex >= currentQuestions.length) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#cbd5e1'; // slate-300
            ctx.font = 'bold 20px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            wrapText(ctx, currentQuestions[currentQuestionIndex].statement, canvas.width / 2, canvas.height / 2, canvas.width - 20, 28);
        }

        function drawFeedback(isCorrect) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 80px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (isCorrect) {
                ctx.fillStyle = '#4ade80'; // green-400
                ctx.fillText('✔', canvas.width / 2, canvas.height / 2);
                document.getElementById('game-screen').classList.add('correct-animation');
            } else {
                ctx.fillStyle = '#f87171'; // red-400
                ctx.fillText('✖', canvas.width / 2, canvas.height / 2);
                document.getElementById('game-screen').classList.add('incorrect-animation');
            }
            
            setTimeout(() => {
                document.getElementById('game-screen').classList.remove('correct-animation', 'incorrect-animation');
            }, 500);
        }

        function handleAnswer(e) {
            if (answerCooldown) return;

            const selectedAnswer = e.target.dataset.answer === 'true';
            const correctAnswer = currentQuestions[currentQuestionIndex].answer;

            if (selectedAnswer === correctAnswer) {
                score++;
                drawFeedback(true);
            } else {
                drawFeedback(false);
            }
            
            answerCooldown = true;

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuestions.length) {
                    updateHUD();
                    drawQuestion();
                    answerCooldown = false;
                } else {
                    endGame();
                }
            }, 1200); // Wait 1.2 second before next question
        }

        function updateHUD() {
            scoreDisplay.textContent = `Score: ${score}`;
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} / ${currentQuestions.length}`;
        }

        function endGame() {
            showScreen(endScreen);
            finalScore.textContent = `${score} / ${currentQuestions.length}`;
            
            let percentage = (score / currentQuestions.length) * 100;
            if (percentage === 100) {
                feedbackMessage.textContent = "Excellent! You answered all questions correctly!";
            } else if (percentage >= 75) {
                feedbackMessage.textContent = "Very good! You have impressive reading skills.";
            } else if (percentage >= 50) {
                feedbackMessage.textContent = "Good job! Keep trying.";
            } else {
                feedbackMessage.textContent = "Don't give up! Read the passage again and try once more to improve your score.";
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        finishedReadingBtn.addEventListener('click', startQuiz);
        restartQuizBtn.addEventListener('click', restartQuiz);
        nextPassageBtn.addEventListener('click', startGame);
        
        answerButtons.forEach(button => {
            button.addEventListener('click', handleAnswer);
        });

        // Initial state
        showScreen(startScreen);
    </script>
</body>
</html>
