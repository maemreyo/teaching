<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game: Nối Chữ Loạn Xạ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        #timer-bar-inner {
            transition: width 0.1s linear;
        }
        .letter-tile {
            transition: all 0.2s ease-in-out;
            touch-action: none; /* For better drag and drop on touch devices */
        }
        .letter-tile:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes flash {
            0%, 100% { transform: scale(1); }
            50% {
                transform: scale(1.25);
                background-color: #22c55e;
                color: white;
                box-shadow: 0 0 20px #22c55e;
            }
        }
        .flash {
            animation: flash 1s ease-in-out;
        }
        
        .dragging {
            opacity: 0.5;
            transform: scale(0.9);
        }

        #answer-container {
            border: 2px dashed #a78bfa; /* violet-300 */
        }

        #answer-container.drag-over {
            border-color: #7c3aed; /* violet-700 */
            background-color: #f5f3ff; /* violet-50 */
        }

    </style>
</head>
<body class="bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center min-h-screen p-4">

    <div id="game-container" class="bg-white/90 backdrop-blur-sm p-6 sm:p-8 rounded-2xl shadow-2xl max-w-2xl w-full text-center">
        
        <div id="start-screen">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Nối Chữ Loạn Xạ</h1>
            <p class="text-gray-600 mb-8">Sắp xếp các chữ cái để tạo thành từ đúng!</p>
            <button id="start-btn" class="w-full bg-indigo-600 text-white py-3 px-8 rounded-lg shadow-lg hover:bg-indigo-700 transition-all duration-300 transform hover:scale-105 text-xl font-semibold">Bắt đầu!</button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <p class="text-lg font-semibold text-gray-700">Câu: <span id="question-counter">1/10</span></p>
                <p class="text-lg font-semibold text-gray-700">Điểm: <span id="score-counter">0</span></p>
            </div>

            <div class="relative w-full h-3 bg-gray-200 rounded-full overflow-hidden mb-6">
                <div id="timer-bar-inner" class="h-full bg-green-500"></div>
            </div>

            <p class="text-gray-600 mb-2">Hãy sắp xếp các chữ cái để tạo thành từ có nghĩa:</p>
            <p id="definition" class="text-2xl font-bold text-indigo-800 mb-6 min-h-[72px] flex items-center justify-center"></p>
            
            <div id="answer-container" class="w-full p-4 rounded-lg min-h-[88px] flex justify-center items-center gap-2 sm:gap-4 flex-wrap mb-4 bg-gray-100 transition-colors">
                <!-- Answer tiles go here -->
            </div>

            <p class="text-sm text-gray-500 mb-4">↑ Kéo hoặc nhấn vào các chữ cái bên dưới để xếp vào đây ↑</p>

            <div id="scrambled-word-container" class="w-full p-4 rounded-lg min-h-[88px] flex justify-center items-center gap-2 sm:gap-4 flex-wrap mb-6 bg-indigo-100">
                <!-- Scrambled letter tiles go here -->
            </div>
            
             <div class="flex items-center justify-center space-x-4">
                <button id="submit-btn" class="w-full bg-green-600 text-white py-3 px-8 rounded-lg shadow-lg hover:bg-green-700 transition-colors text-lg font-semibold">Kiểm tra</button>
                <button id="hint-btn" class="bg-yellow-400 text-yellow-900 p-3 rounded-full hover:bg-yellow-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" title="Gợi ý (3 lần, không được tính điểm)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0-0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 017.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </button>
                 <button id="reset-btn" class="bg-red-500 text-white p-3 rounded-full hover:bg-red-600 transition-colors" title="Xếp lại từ đầu">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                         <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M4 4l16 16" />
                     </svg>
                 </button>
            </div>

            <div id="feedback" class="mt-4 text-lg font-medium h-7"></div>
            
            <button id="next-btn" class="w-full mt-4 bg-indigo-600 text-white py-3 px-8 rounded-lg shadow-lg hover:bg-indigo-700 transition-colors hidden">Câu tiếp theo</button>
        </div>

        <div id="end-screen" class="hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Hoàn thành!</h2>
            <p class="text-gray-600 mb-4">Điểm cuối cùng của bạn là:</p>
            <p id="final-score" class="text-7xl font-bold text-indigo-600 mb-8">0</p>
            <button id="restart-btn" class="w-full bg-indigo-600 text-white py-3 px-8 rounded-lg shadow-lg hover:bg-indigo-700 transition-all duration-300 transform hover:scale-105 text-xl font-semibold">Chơi lại</button>
        </div>

    </div>

    <script>
        const vocabulary = [
            { word: "art gallery", pronunciation: "/'a:t gæləri/", definition: "phòng trưng bày các tác phẩm nghệ thuật" },
            { word: "backyard", pronunciation: "/bæk'ja:d/", definition: "sân phía sau nhà" },
            { word: "cathedral", pronunciation: "/kə'di:drəl/", definition: "nhà thờ lớn, thánh đường" },
            { word: "convenient", pronunciation: "/kən'vi:niənt/", definition: "thuận tiện, tiện lợi" },
            { word: "crowded", pronunciation: "/'kraudid/", definition: "đông đúc" },
            { word: "dislike", pronunciation: "/dıs'laık/", definition: "không thích, không ưa, ghét" },
            { word: "exciting", pronunciation: "/ık'sartın/", definition: "thú vị, lí thú, hứng thú" },
            { word: "fantastic", pronunciation: "/fæn'tæstık/", definition: "tuyệt vời" },
            { word: "historic", pronunciation: "/hı'stɒrık/", definition: "cổ, cổ kính" },
            { word: "inconvenient", pronunciation: "/ˌɪnkənˈviːniənt/", definition: "bất tiện, phiền phức" },
            { word: "incredibly", pronunciation: "/ın'kredəbli/", definition: "đáng kinh ngạc, đến nỗi không ngờ" },
            { word: "memorial", pronunciation: "/mə'mɔ:riǝl/", definition: "đài tưởng niệm" },
            { word: "modern", pronunciation: "/'mɒdn/", definition: "hiện đại" },
            { word: "pagoda", pronunciation: "/pə gəudə/", definition: "ngôi chùa" },
            { word: "palace", pronunciation: "/'pæləs/", definition: "cung điện, dinh, phủ" },
            { word: "peaceful", pronunciation: "/'pi:sfl/", definition: "yên tĩnh, bình lặng" },
            { word: "polluted", pronunciation: "/pə'lu:tıd/", definition: "ô nhiễm" },
            { word: "quiet", pronunciation: "/'kwaıət/", definition: "yên lặng, yên tĩnh" },
            { word: "railway station", pronunciation: "/'reılweı 'steıʃn/", definition: "ga tàu hỏa" },
            { word: "square", pronunciation: "/skweə(r)/", definition: "quảng trường" },
            { word: "statue", pronunciation: "/'stætʃu:/", definition: "bức tượng" },
            { word: "suburb", pronunciation: "/'sʌbɜ:b/", definition: "khu vực ngoại ô" },
            { word: "temple", pronunciation: "/'templ/", definition: "đền, điện, miếu" },
            { word: "terrible", pronunciation: "/'terəbl/", definition: "tồi tệ" },
            { word: "workshop", pronunciation: "/'wɜ:kʃɒp/", definition: "phân xưởng (sản xuất, sửa chữa)" }
        ];

        const TOTAL_QUESTIONS = 10;
        const TIMER_DURATION = 30000;
        const HINT_LIMIT = 3;

        let score = 0, questionCount = 0, hintRevealedCount = 0, hintUsed = false;
        let shuffledVocab = [], currentWord = null, gameTimer = null, draggedTile = null;

        const startScreen = document.getElementById('start-screen'), gameScreen = document.getElementById('game-screen'), endScreen = document.getElementById('end-screen');
        const startBtn = document.getElementById('start-btn'), restartBtn = document.getElementById('restart-btn'), nextBtn = document.getElementById('next-btn'), hintBtn = document.getElementById('hint-btn'), submitBtn = document.getElementById('submit-btn'), resetBtn = document.getElementById('reset-btn');
        const questionCounter = document.getElementById('question-counter'), scoreCounter = document.getElementById('score-counter'), timerBar = document.getElementById('timer-bar-inner'), definitionEl = document.getElementById('definition'), scrambledWordContainer = document.getElementById('scrambled-word-container'), answerContainer = document.getElementById('answer-container'), feedback = document.getElementById('feedback'), finalScore = document.getElementById('final-score');
        
        const shuffleArray = (array) => array.sort(() => Math.random() - 0.5);
        const scrambleWord = (word) => {
            const wordWithoutSpaces = word.replace(/\s/g, '');
            let chars = wordWithoutSpaces.split(''), scrambled;
            do { scrambled = shuffleArray([...chars]).join(''); } while (scrambled === wordWithoutSpaces && chars.length > 1);
            return scrambled;
        };

        const startGame = () => {
            score = 0; questionCount = 0;
            shuffledVocab = shuffleArray([...vocabulary]);
            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            displayQuestion();
        };

        const displayQuestion = () => {
            if (questionCount >= TOTAL_QUESTIONS) { showEndScreen(); return; }
            questionCount++;
            currentWord = shuffledVocab[questionCount - 1];
            hintRevealedCount = 0; hintUsed = false;
            questionCounter.textContent = `${questionCount}/${TOTAL_QUESTIONS}`;
            scoreCounter.textContent = score;
            definitionEl.textContent = currentWord.definition;
            feedback.textContent = '';
            nextBtn.classList.add('hidden');
            hintBtn.classList.add('hidden'); hintBtn.disabled = false;
            submitBtn.classList.remove('hidden'); resetBtn.classList.remove('hidden');
            scrambledWordContainer.innerHTML = ''; answerContainer.innerHTML = '';
            
            const scrambled = scrambleWord(currentWord.word);
            scrambled.split('').forEach((letter, index) => {
                const tile = createTile(letter.toUpperCase(), `tile-${index}`);
                scrambledWordContainer.appendChild(tile);
            });
            setTimeout(flashFirstLetterHint, 5000);
            startTimer();
        };
        
        const createTile = (letter, id) => {
            const tile = document.createElement('div');
            tile.textContent = letter;
            tile.id = id;
            tile.className = 'letter-tile bg-yellow-400 text-yellow-900 w-12 h-12 sm:w-14 sm:h-14 flex items-center justify-center text-2xl font-bold rounded-lg shadow-md cursor-pointer select-none';
            tile.draggable = true;
            tile.addEventListener('click', onTileClick);
            tile.addEventListener('dragstart', onDragStart);
            tile.addEventListener('dragend', onDragEnd);
            return tile;
        }

        const onTileClick = (e) => {
            const tile = e.target;
            const parent = tile.parentElement;
            if (parent === scrambledWordContainer) {
                answerContainer.appendChild(tile);
            } else {
                scrambledWordContainer.appendChild(tile);
            }
        };

        const onDragStart = (e) => {
            draggedTile = e.target;
            e.dataTransfer.setData('text/plain', draggedTile.id);
            setTimeout(() => draggedTile.classList.add('dragging'), 0);
        };

        const onDragEnd = () => {
            draggedTile.classList.remove('dragging');
            draggedTile = null;
        };

        const onDragOver = (e) => {
            e.preventDefault();
            answerContainer.classList.add('drag-over');
        };

        const onDragLeave = () => answerContainer.classList.remove('drag-over');

        const onDrop = (e) => {
            e.preventDefault();
            const id = e.dataTransfer.getData('text');
            const tile = document.getElementById(id);
            if(tile) answerContainer.appendChild(tile);
            answerContainer.classList.remove('drag-over');
        };

        const flashFirstLetterHint = () => {
            if (currentWord === shuffledVocab[questionCount - 1] && !submitBtn.classList.contains('hidden')) {
                const firstLetter = currentWord.word.trim()[0].toUpperCase();
                const firstTile = Array.from(scrambledWordContainer.children).find(tile => tile.textContent === firstLetter);
                if (firstTile) {
                    firstTile.classList.add('flash');
                    setTimeout(() => firstTile.classList.remove('flash'), 1000);
                }
            }
        };

        const startTimer = () => {
            clearInterval(gameTimer);
            let timeLeft = TIMER_DURATION;
            timerBar.style.width = '100%';
            timerBar.className = 'h-full bg-green-500';

            gameTimer = setInterval(() => {
                timeLeft -= 100;
                const widthPercent = (timeLeft / TIMER_DURATION) * 100;
                timerBar.style.width = `${widthPercent}%`;
                if (widthPercent <= 50) hintBtn.classList.remove('hidden');
                if (widthPercent < 50 && widthPercent > 25) timerBar.classList.replace('bg-green-500', 'bg-yellow-500');
                else if (widthPercent < 25) timerBar.classList.replace('bg-yellow-500', 'bg-red-500');
                if (timeLeft <= 0) { clearInterval(gameTimer); checkAnswer(); }
            }, 100);
        };
        
        const checkAnswer = () => {
            clearInterval(gameTimer);
            hintBtn.classList.add('hidden');
            submitBtn.classList.add('hidden');
            resetBtn.classList.add('hidden');
            
            const userAnswer = Array.from(answerContainer.children).map(tile => tile.textContent).join('').toLowerCase();
            const correctAnswer = currentWord.word.replace(/\s/g, '').toLowerCase();
            
            if (userAnswer === correctAnswer) {
                if (!hintUsed) score++;
                scoreCounter.textContent = score;
                feedback.textContent = 'Chính xác!';
                feedback.className = 'mt-4 text-lg font-medium h-7 text-green-500';
                answerContainer.classList.add('shake'); // Positive feedback shake
            } else {
                feedback.innerHTML = `Sai rồi! Đáp án là: <strong class="text-indigo-700">${currentWord.word}</strong>`;
                feedback.className = 'mt-4 text-lg font-medium h-7 text-red-500';
                answerContainer.classList.add('shake');
            }
            setTimeout(() => answerContainer.classList.remove('shake'), 500);
            nextBtn.classList.remove('hidden'); nextBtn.focus();
        };

        const revealHint = () => {
            hintUsed = true;
            const correctAnswer = currentWord.word.replace(/\s/g, '').toLowerCase();
            const currentAnswer = Array.from(answerContainer.children).map(tile => tile.textContent).join('').toLowerCase();

            if (hintRevealedCount < HINT_LIMIT && currentAnswer.length < correctAnswer.length) {
                const nextLetter = correctAnswer[currentAnswer.length].toUpperCase();
                const tileToMove = Array.from(scrambledWordContainer.children).find(tile => tile.textContent === nextLetter);
                if (tileToMove) {
                    answerContainer.appendChild(tileToMove);
                    hintRevealedCount++;
                }
                if(hintRevealedCount >= HINT_LIMIT) hintBtn.disabled = true;
            }
        };

        const resetTiles = () => {
            while (answerContainer.firstChild) {
                scrambledWordContainer.appendChild(answerContainer.firstChild);
            }
        };

        const showEndScreen = () => {
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            finalScore.textContent = score;
        };

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        nextBtn.addEventListener('click', displayQuestion);
        hintBtn.addEventListener('click', revealHint);
        submitBtn.addEventListener('click', checkAnswer);
        resetBtn.addEventListener('click', resetTiles);

        answerContainer.addEventListener('dragover', onDragOver);
        answerContainer.addEventListener('dragleave', onDragLeave);
        answerContainer.addEventListener('drop', onDrop);

    </script>
</body>
</html>
