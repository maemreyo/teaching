<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học từ vựng: My Neighbourhood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* CSS cho hiệu ứng lật thẻ */
        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 250px;
            perspective: 1000px; /* Hiệu ứng 3D */
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .flip-card-front {
            background-color: white;
            color: black;
        }
        .flip-card-back {
            background-color: #4f46e5;
            color: white;
            transform: rotateY(180deg);
            padding: 1rem;
        }
        #timer-bar {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="container mx-auto p-4 max-w-2xl w-full">
        <h1 class="text-3xl font-bold text-center text-indigo-700 mb-6">Unit 4: My Neighbourhood</h1>

        <!-- Chuyển đổi chế độ -->
        <div class="flex justify-center mb-6 bg-gray-200 rounded-full p-1">
            <button id="flashcard-mode-btn" class="px-4 py-2 w-1/3 rounded-full text-white bg-indigo-600 shadow-md transition-all duration-300">Flashcards</button>
            <button id="quiz-mode-btn" class="px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300">Quiz</button>
            <button id="typing-mode-btn" class="px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300">Gõ từ</button>
        </div>

        <!-- Chế độ Flashcard -->
        <div id="flashcard-container">
            <div id="card" class="flip-card mx-auto cursor-pointer">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <p id="flashcard-word" class="text-4xl font-bold"></p>
                    </div>
                    <div class="flip-card-back">
                        <p id="flashcard-pronunciation" class="text-lg italic mb-2"></p>
                        <p id="flashcard-definition" class="text-xl font-semibold mb-3 text-center"></p>
                        <p id="flashcard-example" class="text-md text-indigo-200 text-center"></p>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mt-6">
                <button id="prev-btn" class="bg-white text-gray-800 py-2 px-5 rounded-lg shadow hover:bg-gray-200 transition-colors">Previous</button>
                <div class="text-center">
                    <button id="speak-btn" class="bg-indigo-600 text-white p-3 rounded-full shadow-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-transform transform hover:scale-110">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.858 8.464a5 5 0 000 7.072m2.828 9.9a9 9 0 000-12.728M12 12h.01" />
                        </svg>
                    </button>
                    <p id="counter" class="text-gray-600 mt-2"></p>
                </div>
                <button id="next-btn" class="bg-white text-gray-800 py-2 px-5 rounded-lg shadow hover:bg-gray-200 transition-colors">Next</button>
            </div>
             <p class="text-center text-gray-500 text-sm mt-4">Nhấn vào thẻ để lật xem định nghĩa.</p>
        </div>

        <!-- Chế độ Quiz -->
        <div id="quiz-container" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <p class="text-gray-600 mb-1">Nghĩa của từ này là gì?</p>
                <p id="quiz-definition" class="text-2xl font-semibold text-center mb-6 text-indigo-800"></p>
                <div id="quiz-options" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                <div id="quiz-feedback" class="mt-4 text-center font-medium"></div>
            </div>
             <div class="flex justify-center mt-6">
                <button id="next-quiz-btn" class="bg-indigo-600 text-white py-2 px-8 rounded-lg shadow hover:bg-indigo-700 transition-colors hidden">Câu tiếp theo</button>
            </div>
             <div id="quiz-score" class="text-center mt-4 font-bold text-xl text-gray-700"></div>
        </div>
        
        <!-- Chế độ Gõ từ -->
        <div id="typing-container" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <p class="text-gray-600 mb-2 text-center">Hãy gõ từ tiếng Anh tương ứng:</p>
                <p id="typing-definition" class="text-2xl font-semibold text-center mb-6 text-indigo-800"></p>
                <div class="relative w-full h-2 bg-gray-200 rounded-full overflow-hidden mb-4">
                    <div id="timer-bar" class="h-full bg-green-500"></div>
                </div>
                <input type="text" id="typing-input" class="w-full p-4 border-2 border-gray-300 rounded-lg text-xl focus:outline-none focus:border-indigo-500 text-center" placeholder="Gõ từ ở đây..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <div id="typing-feedback" class="mt-4 text-center font-medium h-6"></div>
            </div>
            <div id="typing-score" class="text-center mt-4 font-bold text-xl text-gray-700"></div>
             <div class="flex justify-center mt-6">
                <button id="next-typing-btn" class="bg-indigo-600 text-white py-2 px-8 rounded-lg shadow hover:bg-indigo-700 transition-colors hidden">Câu tiếp theo</button>
            </div>
        </div>

    </div>

    <script>
        const vocabulary = [
            { word: "art gallery", pronunciation: "/'a:t gæləri/", definition: "phòng trưng bày các tác phẩm nghệ thuật", example: "This town is famous for its museums and art galleries." },
            { word: "backyard", pronunciation: "/bæk'ja:d/", definition: "sân phía sau nhà", example: "We usually play badminton in the backyard." },
            { word: "cathedral", pronunciation: "/kə'di:drəl/", definition: "nhà thờ lớn, thánh đường", example: "Can you tell me the way to the cathedral?" },
            { word: "convenient", pronunciation: "/kən'vi:niənt/", definition: "thuận tiện, tiện lợi", example: "The new hospital is very convenient for me because it's in front of my house." },
            { word: "crowded", pronunciation: "/'kraudid/", definition: "đông đúc", example: "In my city, the streets are always crowded." },
            { word: "dislike", pronunciation: "/dıs'laık/", definition: "không thích, không ưa, ghét", example: "What do you dislike about your neighbourhood?" },
            { word: "exciting", pronunciation: "/ık'sartın/", definition: "thú vị, lí thú, hứng thú", example: "Living in the city seems to be more exciting than in the countryside." },
            { word: "fantastic", pronunciation: "/fæn'tæstık/", definition: "tuyệt vời", example: "This is a fantastic beach!" },
            { word: "historic", pronunciation: "/hı'stɒrık/", definition: "cổ, cổ kính", example: "Many historic buildings in Hoi An have been preserved." },
            { word: "inconvenient", pronunciation: "/ˌɪnkənˈviːniənt/", definition: "bất tiện, phiền phức", example: "There isn't a supermarket in her village. It's inconvenient." },
            { word: "incredibly", pronunciation: "/ın'kredəbli/", definition: "đáng kinh ngạc, đến nỗi không ngờ", example: "My new neighbours are incredibly kind." },
            { word: "memorial", pronunciation: "/mə'mɔ:riǝl/", definition: "đài tưởng niệm", example: "The memorial stands where the two roads meet." },
            { word: "modern", pronunciation: "/'mɒdn/", definition: "hiện đại", example: "There are many modern buildings in my neighbourhood." },
            { word: "pagoda", pronunciation: "/pə gəudə/", definition: "ngôi chùa", example: "My family is going to the pagoda this Saturday." },
            { word: "palace", pronunciation: "/'pæləs/", definition: "cung điện, dinh, phủ", example: "The palace only opens to the public during the spring months." },
            { word: "peaceful", pronunciation: "/'pi:sfl/", definition: "yên tĩnh, bình lặng", example: "Evening in the country is a very peaceful time." },
            { word: "polluted", pronunciation: "/pə'lu:tıd/", definition: "ô nhiễm", example: "The air in this city is polluted with toxic waste from the factories." },
            { word: "quiet", pronunciation: "/'kwaıət/", definition: "yên lặng, yên tĩnh", example: "I live in a quiet neighborhood." },
            { word: "railway station", pronunciation: "/'reılweı 'steıʃn/", definition: "ga tàu hỏa", example: "The railway station is far from my house." },
            { word: "square", pronunciation: "/skweə(r)/", definition: "quảng trường", example: "Is there a square in your town?" },
            { word: "statue", pronunciation: "/'stætʃu:/", definition: "bức tượng", example: "The statue is made of bronze." },
            { word: "suburb", pronunciation: "/'sʌbɜ:b/", definition: "khu vực ngoại ô", example: "My grandparents live in the suburbs of Hanoi." },
            { word: "temple", pronunciation: "/'templ/", definition: "đền, điện, miếu", example: "My district has many ancient temples." },
            { word: "terrible", pronunciation: "/'terəbl/", definition: "tồi tệ", example: "The weather here is terrible." },
            { word: "workshop", pronunciation: "/'wɜ:kʃɒp/", definition: "phân xưởng (sản xuất, sửa chữa)", example: "Their goods are produced from a small workshop." }
        ];

        let currentIndex = 0;
        let score = 0;
        let quizQuestionCount = 0;
        const totalGameQuestions = 10;
        let shuffledVocab = [];
        
        let typingTimer;
        const TIMER_DURATION = 10000; // 10 giây

        // Lấy các element
        const flashcardContainer = document.getElementById('flashcard-container');
        const quizContainer = document.getElementById('quiz-container');
        const typingContainer = document.getElementById('typing-container');
        const flashcardModeBtn = document.getElementById('flashcard-mode-btn');
        const quizModeBtn = document.getElementById('quiz-mode-btn');
        const typingModeBtn = document.getElementById('typing-mode-btn');

        // Flashcard elements
        const card = document.getElementById('card');
        const flashcardWord = document.getElementById('flashcard-word');
        const flashcardPronunciation = document.getElementById('flashcard-pronunciation');
        const flashcardDefinition = document.getElementById('flashcard-definition');
        const flashcardExample = document.getElementById('flashcard-example');
        const counter = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const speakBtn = document.getElementById('speak-btn');

        // Quiz elements
        const quizDefinition = document.getElementById('quiz-definition');
        const quizOptions = document.getElementById('quiz-options');
        const quizFeedback = document.getElementById('quiz-feedback');
        const nextQuizBtn = document.getElementById('next-quiz-btn');
        const quizScore = document.getElementById('quiz-score');

        // Typing elements
        const typingDefinition = document.getElementById('typing-definition');
        const timerBar = document.getElementById('timer-bar');
        const typingInput = document.getElementById('typing-input');
        const typingFeedback = document.getElementById('typing-feedback');
        const typingScore = document.getElementById('typing-score');
        const nextTypingBtn = document.getElementById('next-typing-btn');


        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // --- Logic cho Flashcard ---
        function updateFlashcard() {
            const currentWord = vocabulary[currentIndex];
            flashcardWord.textContent = currentWord.word;
            flashcardPronunciation.textContent = currentWord.pronunciation;
            flashcardDefinition.textContent = currentWord.definition;
            flashcardExample.textContent = `e.g., "${currentWord.example}"`;
            counter.textContent = `${currentIndex + 1} / ${vocabulary.length}`;
            card.classList.remove('flipped');
        }

        // --- Logic cho Quiz ---
        function startQuiz() {
            score = 0;
            quizQuestionCount = 0;
            shuffledVocab = shuffleArray([...vocabulary]);
            nextQuizBtn.classList.add('hidden');
            displayQuizQuestion();
        }

        function displayQuizQuestion() {
            if(quizQuestionCount >= totalGameQuestions) {
                showFinalScore('quiz');
                return;
            }
            quizOptions.innerHTML = '';
            quizFeedback.textContent = '';
            nextQuizBtn.classList.add('hidden');
            quizScore.textContent = `Score: ${score} / ${quizQuestionCount}`;

            const correctWord = shuffledVocab[quizQuestionCount];
            quizDefinition.textContent = correctWord.definition;

            let options = [correctWord];
            while (options.length < 4) {
                const randomWord = vocabulary[Math.floor(Math.random() * vocabulary.length)];
                if (!options.some(opt => opt.word === randomWord.word)) {
                    options.push(randomWord);
                }
            }

            shuffleArray(options).forEach(option => {
                const button = document.createElement('button');
                button.textContent = option.word;
                button.classList.add('p-4', 'border', 'rounded-lg', 'text-left', 'hover:bg-gray-100', 'transition-colors', 'w-full');
                button.onclick = () => checkQuizAnswer(option.word === correctWord.word, button);
                quizOptions.appendChild(button);
            });
        }
        
        function checkQuizAnswer(isCorrect, button) {
            Array.from(quizOptions.children).forEach(btn => btn.disabled = true);
            if(isCorrect) {
                score++;
                quizFeedback.textContent = 'Chính xác!';
                quizFeedback.classList.add('text-green-500');
                quizFeedback.classList.remove('text-red-500');
                button.classList.add('bg-green-200', 'border-green-500');
            } else {
                quizFeedback.textContent = `Sai rồi! Đáp án là: ${shuffledVocab[quizQuestionCount].word}`;
                quizFeedback.classList.add('text-red-500');
                 quizFeedback.classList.remove('text-green-500');
                button.classList.add('bg-red-200', 'border-red-500');
            }
            quizQuestionCount++;
            quizScore.textContent = `Score: ${score} / ${quizQuestionCount}`;
            nextQuizBtn.classList.remove('hidden');
        }

        // --- Logic cho Gõ từ ---
        function startTypingGame() {
            score = 0;
            quizQuestionCount = 0;
            shuffledVocab = shuffleArray([...vocabulary]);
            nextTypingBtn.classList.add('hidden');
            displayTypingQuestion();
        }

        function displayTypingQuestion() {
            if (quizQuestionCount >= totalGameQuestions) {
                showFinalScore('typing');
                return;
            }

            typingFeedback.textContent = '';
            typingInput.value = '';
            typingInput.disabled = false;
            typingInput.focus();
            nextTypingBtn.classList.add('hidden');
            typingScore.textContent = `Score: ${score} / ${quizQuestionCount}`;

            const currentWord = shuffledVocab[quizQuestionCount];
            typingDefinition.textContent = currentWord.definition;
            
            let timeLeft = TIMER_DURATION;
            timerBar.style.width = '100%';
            timerBar.classList.remove('bg-red-500');
            timerBar.classList.add('bg-green-500');


            clearInterval(typingTimer);
            typingTimer = setInterval(() => {
                timeLeft -= 100;
                const widthPercentage = (timeLeft / TIMER_DURATION) * 100;
                timerBar.style.width = `${widthPercentage}%`;

                if (widthPercentage < 25) {
                    timerBar.classList.remove('bg-green-500');
                    timerBar.classList.add('bg-red-500');
                }

                if (timeLeft <= 0) {
                    clearInterval(typingTimer);
                    checkTypingAnswer();
                }
            }, 100);
        }

        function checkTypingAnswer() {
            clearInterval(typingTimer);
            typingInput.disabled = true;

            const userAnswer = typingInput.value.trim().toLowerCase();
            const correctAnswer = shuffledVocab[quizQuestionCount].word.toLowerCase();

            if (userAnswer === correctAnswer) {
                score++;
                typingFeedback.textContent = 'Chính xác!';
                typingFeedback.classList.add('text-green-500');
                typingFeedback.classList.remove('text-red-500');
            } else {
                typingFeedback.textContent = `Sai rồi! Đáp án đúng là: "${shuffledVocab[quizQuestionCount].word}"`;
                typingFeedback.classList.add('text-red-500');
                typingFeedback.classList.remove('text-green-500');
            }
            quizQuestionCount++;
            typingScore.textContent = `Score: ${score} / ${quizQuestionCount}`;
            nextTypingBtn.classList.remove('hidden');
        }

        typingInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkTypingAnswer();
            }
        });
        
        nextTypingBtn.addEventListener('click', displayTypingQuestion);


        function showFinalScore(mode) {
             let definitionEl, optionsEl, feedbackEl, nextBtnEl;

            if (mode === 'quiz') {
                definitionEl = quizDefinition;
                optionsEl = quizOptions;
                feedbackEl = quizFeedback;
                nextBtnEl = nextQuizBtn;
                nextBtnEl.onclick = startQuiz;
            } else { // typing
                definitionEl = typingDefinition;
                optionsEl = typingInput.parentElement; // parent div
                feedbackEl = typingFeedback;
                nextBtnEl = nextTypingBtn;
                nextBtnEl.onclick = startTypingGame;
                optionsEl.innerHTML = ''; // Clear input and timer bar
            }

            definitionEl.textContent = 'Hoàn thành!';
            optionsEl.innerHTML = `<p class="text-center col-span-2 text-lg">Điểm cuối cùng của bạn là:</p> <p class="text-center col-span-2 text-5xl font-bold text-indigo-600">${score} / ${totalGameQuestions}</p>`;
            feedbackEl.textContent = '';
            nextBtnEl.textContent = 'Chơi lại';
            nextBtnEl.classList.remove('hidden');
        }

        // --- Event Listeners ---
        card.addEventListener('click', () => card.classList.toggle('flipped'));
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % vocabulary.length;
            updateFlashcard();
        });
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + vocabulary.length) % vocabulary.length;
            updateFlashcard();
        });
        speakBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const utterance = new SpeechSynthesisUtterance(vocabulary[currentIndex].word);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        });
        nextQuizBtn.addEventListener('click', displayQuizQuestion);

        flashcardModeBtn.addEventListener('click', () => {
            flashcardContainer.classList.remove('hidden');
            quizContainer.classList.add('hidden');
            typingContainer.classList.add('hidden');
            flashcardModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-white bg-indigo-600 shadow-md transition-all duration-300';
            quizModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300';
            typingModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300';
        });

        quizModeBtn.addEventListener('click', () => {
            flashcardContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            typingContainer.classList.add('hidden');
            quizModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-white bg-indigo-600 shadow-md transition-all duration-300';
            flashcardModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300';
            typingModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300';
            startQuiz();
        });
        
        typingModeBtn.addEventListener('click', () => {
            flashcardContainer.classList.add('hidden');
            quizContainer.classList.add('hidden');
            typingContainer.classList.remove('hidden');
            typingModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-white bg-indigo-600 shadow-md transition-all duration-300';
            flashcardModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300';
            quizModeBtn.className = 'px-4 py-2 w-1/3 rounded-full text-gray-700 transition-all duration-300';
            startTypingGame();
        });

        // Khởi tạo
        updateFlashcard();
    </script>

</body>
</html>
