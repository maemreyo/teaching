<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module: Chinh Phục Dạng Bài Bản Đồ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Be Vietnam Pro", sans-serif;
      }
      .gradient-text {
        background: linear-gradient(to right, #16a34a, #22c55e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body class="bg-slate-100">
    <div class="container mx-auto px-4 py-12">
      <header class="text-center mb-12">
        <h1
          class="text-5xl md:text-7xl font-black gradient-text tracking-tight"
        >
          Chinh Phục Dạng Bài Bản Đồ
        </h1>
        <p class="mt-4 text-xl text-slate-600">
          Lộ trình toàn diện để làm chủ các câu hỏi Map/Plan Labelling.
        </p>
      </header>

      <main class="max-w-3xl mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-8">
          <h2 class="text-3xl font-bold text-slate-800 mb-8 border-b pb-4">
            Nội Dung Học Phần
          </h2>
          <ol class="space-y-5 list-decimal list-inside">
            <li>
              <a
                href="1__gioi-thieu.html"
                class="text-lg font-semibold text-blue-600 hover:text-blue-800 hover:underline transition-colors duration-300"
                >Giới Thiệu Dạng Bài Bản Đồ</a
              >
            </li>
            <li>
              <a
                href="2__chien-luoc.html"
                class="text-lg font-semibold text-blue-600 hover:text-blue-800 hover:underline transition-colors duration-300"
                >Từ Vựng & Chiến Lược Làm Bài</a
              >
            </li>
            <li>
              <a
                href="3__cam-bay.html"
                class="text-lg font-semibold text-blue-600 hover:text-blue-800 hover:underline transition-colors duration-300"
                >Lỗi Sai, Cạm Bẫy & Kỹ Thuật Nâng Cao</a
              >
            </li>
            <li>
              <a
                href="4__ke-hoach-luyen-tap.html"
                class="text-lg font-semibold text-blue-600 hover:text-blue-800 hover:underline transition-colors duration-300"
                >Kế Hoạch Luyện Tập & Ứng Dụng</a
              >
            </li>
          </ol>
        </div>
      </main>

      <footer class="text-center mt-12 text-slate-500"></footer>
    </div>
  </body>
</html>
